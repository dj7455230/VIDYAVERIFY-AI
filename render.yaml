services:
  # 1. PostgreSQL Database
  - type: pg
    name: vidyaverify-db
    env: postgres
    plan: free
    databaseName: vidyaverify
    user: vidyaverify_user

  # 2. FastAPI Backend
  - type: web
    name: vidyaverify-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "alembic upgrade head && python -m scripts.seed_demo_data && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vidyaverify-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_LABEL
        value: "SYNTHETIC DEMONSTRATION DATA"
      - key: CORS_ORIGINS
        value: "*"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
