version: "3.9"

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: vidyaverify
      POSTGRES_USER: vidyaverify_user
      POSTGRES_PASSWORD: vidyaverify_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidyaverify_user -d vidyaverify"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://vidyaverify_user:vidyaverify_pass_2026@db:5432/vidyaverify
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string}
      BACKEND_ENV: production
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    command: >
      sh -c "alembic upgrade head &&
             python -m scripts.seed_demo_data &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
